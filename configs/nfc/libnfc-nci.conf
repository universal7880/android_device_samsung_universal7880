# NFC stack configuration for Samsung S.LSI controllers.
NFC_DEBUG_ENABLED=1

# Framework-owned NFC storage.
NFA_STORAGE="/data/nfc"
PRESERVE_STORAGE=1

# Controller state while the screen is off.
SCREEN_OFF_POWER_STATE=1

# Polling technologies and discovery duration.
POLLING_TECH_MASK=0xEF
NFA_DM_DISC_DURATION_POLL=500

# Secure-element routing capabilities.
AID_MATCHING_MODE=0x01
UICC_LISTEN_TECH_MASK=0x07
